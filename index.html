<!doctype html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Title -->
  <title>Sridhar Portfolio</title>
  <!-- Canonical URL -->
  <link rel="canonical" href="https://sridhar-dev-portfolio.vercel.app" />

  <!-- SEO -->
  <meta name="description"
    content="Sridhar is a Frontend Developer and MERN Stack Learner skilled in React, TypeScript, Tailwind CSS, and modern web technologies. Explore projects, skills, and experience." />
  <meta name="keywords"
    content="Sridhar, Frontend Developer, MERN Stack Developer, React Developer, TypeScript, Tailwind CSS, Portfolio" />
  <meta name="author" content="Sridhar" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Favicon (Vite BEST PRACTICE) -->
  <!-- IMPORTANT: move favicon to /public -->
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Open Graph (LinkedIn, WhatsApp, Facebook) -->
  <meta property="og:title" content="Sridhar Portfolio" />
  <meta property="og:description"
    content="Frontend-focused developer building clean, responsive, and user-friendly web applications using React and modern technologies." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sridhar-dev-portfolio.vercel.app" />
  <meta property="og:image" content="https://sridhar-dev-portfolio.vercel.app/og-image.png" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sridhar Portfolio" />
  <meta name="twitter:description"
    content="Explore Sridhar’s portfolio showcasing frontend projects, skills, and MERN stack learning journey." />
  <meta name="twitter:image" content="https://sridhar-dev-portfolio.vercel.app/og-image.png" />

  <!-- Theme Color (Mobile browser UI) -->
  <meta name="theme-color" content="#06b6d4" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
